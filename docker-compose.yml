services:
  postgres:
    image: postgres:16-alpine
    container_name: can-i-apply-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: can_i_apply
    ports:
      - '5432:5432'
    volumes:
      - can-i-apply-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  can-i-apply-pgdata:
